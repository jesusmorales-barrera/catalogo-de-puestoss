<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor de cédulas</title>
  <style>
    :root{--wine:#691a32;--gold:#bc955b;--ink:#202124;--muted:#687078;--line:#d7d9dc;--bg:#f4f5f7;--white:#fff;--bad:#a52a2a}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit;letter-spacing:0}.top{min-height:68px;background:#fff;border-bottom:4px solid var(--wine);display:grid;grid-template-columns:auto minmax(260px,620px) auto;gap:22px;align-items:center;padding:10px 24px}.brand{font-size:20px;font-weight:700;color:var(--wine);white-space:nowrap}.top input{height:38px}.muted{color:var(--muted)}.layout{height:calc(100vh - 68px);display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.filters{padding:12px 14px;border-bottom:1px solid var(--line)}input,textarea{width:100%;border:1px solid #b9bdc2;border-radius:4px;padding:9px 10px;background:#fff}input:focus,textarea:focus{outline:2px solid #691a3238;border-color:var(--wine)}.check{display:flex;gap:8px;align-items:center;color:var(--muted)}.check input{width:auto}#list{overflow:auto;flex:1}.item{width:100%;border:0;border-bottom:1px solid #eceef0;border-radius:0;background:#fff;padding:12px 14px;text-align:left;cursor:pointer}.item:hover{background:#f7f2f4}.item.active{background:#f1e7eb;box-shadow:inset 4px 0 var(--wine)}.item strong{display:block;line-height:1.3}.item small{color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px}main{overflow:auto;padding:18px 26px 50px}.empty{max-width:700px;margin:18vh auto;text-align:center;color:var(--muted)}form{max-width:1180px;margin:0 auto}.formhead{position:sticky;top:-18px;z-index:3;background:var(--bg);padding:10px 0 12px;display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0;color:var(--wine)}h2{font-size:15px;margin:22px 0 10px;color:var(--wine);border-bottom:2px solid var(--gold);padding-bottom:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}.wide{grid-column:1/-1}label span{display:block;font-weight:700;font-size:12px;margin-bottom:6px;text-transform:uppercase}textarea{min-height:94px;resize:vertical;line-height:1.5}.actions{display:flex;gap:8px}.command{border:1px solid var(--wine);border-radius:4px;padding:8px 13px;cursor:pointer;background:var(--wine);color:#fff;font-weight:700}.command:disabled{cursor:wait;opacity:.6}.secondary{background:#fff;color:var(--wine)}.function{display:grid;grid-template-columns:30px minmax(0,1fr) 24px;gap:8px;margin-bottom:14px;align-items:start}.function .num{height:30px;display:grid;place-items:center;font-weight:700;color:var(--muted)}.function textarea{min-height:152px;padding:14px 16px;font-size:15px;line-height:1.7}.function-controls{display:flex;flex-direction:column;align-items:center;gap:7px}.icon{width:24px;height:24px;padding:0;border:0;background:transparent;color:#555;cursor:pointer;font-size:18px;font-weight:700;line-height:1}.icon:hover{color:var(--wine);background:#eee}.icon:last-child:hover{color:var(--bad)}.notice{min-height:20px;font-weight:700;color:var(--muted)}.notice.ok{color:#28643b}.notice.error{color:var(--bad)}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(255,255,255,.82);backdrop-filter:blur(2px)}.loading-box{display:flex;align-items:center;gap:14px;padding:18px 22px;background:#fff;border:1px solid #d7c3ca;border-radius:6px;box-shadow:0 12px 32px rgba(70,20,38,.2);color:var(--wine);font-weight:700}.spinner{width:30px;height:30px;border:4px solid #eadbe0;border-top-color:var(--wine);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}[hidden]{display:none!important}@media(max-width:760px){.top{grid-template-columns:1fr;gap:8px}.brand{white-space:normal}.layout{grid-template-columns:1fr;height:auto}aside{height:34vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:14px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.formhead{top:0}.function{grid-template-columns:26px minmax(0,1fr) 22px}}
  </style>
</head>
<body>
<header class="top"><div class="brand">Catálogo sectorial de puestos</div><input id="search" type="search" placeholder="Buscar puesto o nivel" aria-label="Buscar puesto o nivel"><div class="muted" id="count">Cargando...</div></header>
<div class="layout"><aside><div class="filters"><label class="check"><input id="incomplete" type="checkbox"> Mostrar campos incompletos</label></div><div id="list"></div></aside>
<main><div class="empty" id="empty"><h1>Selecciona una cédula</h1></div><form id="form" hidden><div class="formhead"><div><h1 id="title"></h1><div id="notice" class="notice"></div><a id="pdfLink" target="_blank" rel="noopener" hidden>Abrir PDF generado</a></div><div class="actions"><button type="button" class="command secondary" id="pdfCurrent">PDF actual</button><button type="button" class="command secondary" id="pdfAll">PDF completo</button><button type="button" class="command secondary" id="reload">Recargar</button><button class="command">Guardar</button></div></div>
<h2>Funciones</h2><div id="functions"></div><button type="button" class="command secondary" id="add">Agregar función</button>
<h2>Datos del puesto</h2><div class="grid"><label><span>Nivel</span><input name="nivel"></label><label><span>Categoría</span><input name="categoria"></label><label class="wide"><span>Puesto</span><textarea name="puesto" required></textarea></label><label class="wide"><span>Denominación genérica del puesto</span><textarea name="denominacion_generica_puesto"></textarea></label><label class="wide"><span>Perfil</span><textarea name="perfil"></textarea></label></div>
<h2>Requisitos</h2><div class="grid"><label><span>Escolaridad requerida</span><textarea name="escolaridad_requerida"></textarea></label><label><span>Experiencia</span><textarea name="experiencia_anios"></textarea></label><label class="wide"><span>Conocimientos</span><textarea name="conocimientos"></textarea></label></div>
</form></main></div>
<div id="loading" class="loading" hidden aria-live="polite" aria-busy="true"><div class="loading-box"><span class="spinner" aria-hidden="true"></span><span id="loadingText">Generando PDF...</span></div></div>
<script>
const fields=['perfil','nivel','puesto','categoria','escolaridad_requerida','experiencia_anios','conocimientos','denominacion_generica_puesto'];let records=[],current=null,revision=null,dirty=false;const form=document.querySelector('#form'),list=document.querySelector('#list'),notice=document.querySelector('#notice');
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};async function api(url,opt={}){const r=await fetch(url,opt),b=await r.json();if(!r.ok)throw Error(b.error||'Error');return b}function message(t,c=''){notice.textContent=t;notice.className='notice '+c}
async function loadList(first=false){const d=await api('/api/puestos');records=d.registros;revision=d.revision;document.querySelector('#count').textContent=`${records.length} puestos`;renderList();if(first&&records.length)select(records[0].id)}function renderList(){const q=document.querySelector('#search').value.toLowerCase(),inc=document.querySelector('#incomplete').checked;list.innerHTML='';records.filter(r=>(!inc||r.incompleto)&&`${r.puesto} ${r.nivel}`.toLowerCase().includes(q)).forEach(r=>{const b=document.createElement('button');b.type='button';b.className='item'+(r.id===current?' active':'');b.innerHTML=`<strong>${esc(r.puesto)}${r.incompleto?'<i class="dot" title="Campos incompletos"></i>':''}</strong><small>Nivel ${esc(r.nivel||'—')}</small>`;b.onclick=()=>select(r.id);list.appendChild(b)})}
async function select(id){if(dirty&&!confirm('Hay cambios sin guardar. ¿Deseas descartarlos?'))return;const d=await api('/api/puestos/'+encodeURIComponent(id));current=id;revision=d.revision;fields.forEach(f=>form.elements[f].value=d.registro[f]??'');functions(d.registro.funciones_genericas||[]);document.querySelector('#title').textContent=d.registro.puesto;document.querySelector('#empty').hidden=true;form.hidden=false;dirty=false;message('');renderList()}
function values(){return [...document.querySelectorAll('#functions textarea')].map(x=>x.value.trim()).filter(Boolean)}function functions(items){const box=document.querySelector('#functions');box.innerHTML='';items.forEach((text,i)=>{const row=document.createElement('div');row.className='function';row.innerHTML=`<div class="num">${i+1}</div><textarea>${esc(text)}</textarea><div class="function-controls"><button type="button" class="icon" title="Subir" aria-label="Subir">↑</button><button type="button" class="icon" title="Bajar" aria-label="Bajar">↓</button><button type="button" class="icon" title="Eliminar" aria-label="Eliminar">×</button></div>`;const bs=row.querySelectorAll('button');bs[0].onclick=()=>move(i,-1);bs[1].onclick=()=>move(i,1);bs[2].onclick=()=>{row.remove();renumber();dirty=true};row.querySelector('textarea').oninput=()=>dirty=true;box.appendChild(row)})}function move(i,d){const a=values(),t=i+d;if(t<0||t>=a.length)return;[a[i],a[t]]=[a[t],a[i]];functions(a);dirty=true}function renumber(){document.querySelectorAll('.num').forEach((x,i)=>x.textContent=i+1)}
async function saveCurrent(){const p={revision};fields.forEach(f=>p[f]=form.elements[f].value);p.funciones_genericas=values();const d=await api('/api/puestos/'+encodeURIComponent(current),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});revision=d.revision;dirty=false;await loadList();return d}async function generatePdf(mode){const buttons=[document.querySelector('#pdfCurrent'),document.querySelector('#pdfAll')],loading=document.querySelector('#loading'),loadingText=document.querySelector('#loadingText'),pdfLink=document.querySelector('#pdfLink');buttons.forEach(b=>b.disabled=true);pdfLink.hidden=true;loadingText.textContent=mode==='completo'?'Generando catálogo completo...':'Generando cédula...';loading.hidden=false;await new Promise(resolve=>setTimeout(resolve,100));try{const saved=await saveCurrent();message(saved.campos_modificados.length?'Cambios guardados. Generando PDF...':'Generando PDF...');const url=mode==='completo'?'/api/generar/completo':'/api/generar/puesto/'+encodeURIComponent(current);const result=await api(url,{method:'POST'});pdfLink.href=result.url;pdfLink.hidden=false;message('PDF generado','ok')}catch(e){message(e.message,'error')}finally{loading.hidden=true;buttons.forEach(b=>b.disabled=false)}}form.oninput=()=>dirty=true;form.onsubmit=async e=>{e.preventDefault();try{const d=await saveCurrent();message(d.campos_modificados.length?'Cambios guardados':'Sin cambios','ok')}catch(e){message(e.message,'error')}};document.querySelector('#pdfCurrent').onclick=()=>generatePdf('actual');document.querySelector('#pdfAll').onclick=()=>generatePdf('completo');document.querySelector('#reload').onclick=()=>current&&select(current);document.querySelector('#add').onclick=()=>{functions([...values(),'']);const a=document.querySelectorAll('#functions textarea');a[a.length-1].focus();dirty=true};document.querySelector('#search').oninput=renderList;document.querySelector('#incomplete').onchange=renderList;loadList(true).catch(e=>{document.querySelector('#empty').innerHTML=`<h1>Error</h1><p>${esc(e.message)}</p>`});
</script></body></html>
